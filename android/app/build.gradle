apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.notzyvex.fastprint"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.notzyvex.fastprint"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {

            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    def ksProps = new Properties()
    def ksFile = rootProject.file('keystore.properties')
    def ksReady = false
    if (ksFile.exists()) {
        ksFile.withInputStream { ksProps.load(it) }
        def sf = ksProps['storeFile']
        ksReady = sf && ksProps['storePassword'] && ksProps['keyAlias'] && ksProps['keyPassword'] && rootProject.file(sf).exists()
    }
    if (!ksReady) {
        logger.warn('FASTPRINT: signing config incomplete, using the debug key. Google Sign-In and in-app updates will not work in this APK.')
    }

    signingConfigs {
        fastprint {
            if (ksReady) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            if (ksReady) {
                signingConfig signingConfigs.fastprint
            }
        }
        release {
            if (ksReady) {
                signingConfig signingConfigs.fastprint
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def suffix = variant.buildType.name == 'release' ? '' : '-' + variant.buildType.name
            outputFileName = "FastPrint-${variant.versionName}${suffix}.apk"
        }
    }
}


repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
