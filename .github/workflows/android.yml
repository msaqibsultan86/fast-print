name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The OAuth client ID is not in the repo. Provide it as a repository secret named
      # GOOGLE_WEB_CLIENT_ID to get working Google Sign-In in CI builds; without it the app
      # still builds and runs, and the Google button reports that sign-in is unconfigured.
      - name: Write local.properties
        run: echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" > local.properties

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fast-print-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
