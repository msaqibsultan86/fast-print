name: Release

# Push a tag like v1.1.0 and this builds a signed APK and publishes it as a GitHub
# Release. That release is exactly what the in-app updater reads, so this workflow is
# what makes "push an update and every install sees it" actually work.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing $V"

      # The keystore is stored as a base64 secret. It MUST be the same key that signed
      # every previous release, or Android refuses the update as signature-incompatible.
      # Names only, never values — makes a missing or misnamed secret obvious immediately.
      - name: Check secrets are present
        run: |
          check() { if [ -n "$2" ]; then echo "  OK      $1"; else echo "  MISSING $1"; fi; }
          echo "Repository secrets visible to this run:"
          check GOOGLE_WEB_CLIENT_ID "${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
          check KEYSTORE_BASE64      "${{ secrets.KEYSTORE_BASE64 }}"
          check KEYSTORE_PASSWORD    "${{ secrets.KEYSTORE_PASSWORD }}"
          check KEY_ALIAS            "${{ secrets.KEY_ALIAS }}"
          check KEY_PASSWORD         "${{ secrets.KEY_PASSWORD }}"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. Add it at Settings > Secrets and variables > Actions > New repository secret (the Secrets tab, not Variables)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "keystore restored ($(stat -c%s release.keystore) bytes)"

      - name: Write local.properties
        run: |
          {
            echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
            echo "RELEASE_STORE_FILE=release.keystore"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
          } > local.properties

      - name: Set version name
        run: |
          sed -i "s/versionName = \".*\"/versionName = \"${{ steps.ver.outputs.version }}\"/" app/build.gradle.kts
          grep -n "versionName" app/build.gradle.kts

      - name: Build signed release APK
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --console=plain 2>&1 | tee build.log

      - name: Report failure to job summary
        if: failure()
        run: |
          {
            echo '## Release build failed'
            echo '```'
            grep -E "^(e:|FAILURE|Caused by|> Task .* FAILED|\* What went wrong)" build.log | head -120 || true
            echo '```'
            echo '### Last 150 lines'
            echo '```'
            tail -n 150 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the APK is signed with the expected key
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK"
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$APK" | grep -i "SHA-1" || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Fast Print v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore local.properties
