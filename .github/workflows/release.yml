name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KPW: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KP" ] && [ -n "$KA" ] && [ -n "$KPW" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/fastprint.keystore
            {
              echo "storeFile=fastprint.keystore"
              echo "storePassword=$KP"
              echo "keyAlias=$KA"
              echo "keyPassword=$KPW"
            } > android/keystore.properties
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets incomplete. Publishing a debug-signed APK so it installs. Updates between builds will be rejected until KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD are set."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - run: npm install && npx cap sync android

      - name: Build
        run: |
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.ver.outputs.version }}\"/" android/app/build.gradle
          cd android && chmod +x gradlew
          if [ "${{ steps.sign.outputs.mode }}" = "release" ]; then
            ./gradlew assembleRelease --console=plain
          else
            ./gradlew assembleDebug --console=plain
          fi

      - name: Verify signature
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK: $APK"
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$APK"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Fast Print v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/*/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
